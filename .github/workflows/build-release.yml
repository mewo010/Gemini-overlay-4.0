name: Build Windows EXE and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set app version
        shell: bash
        run: |
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"1.0.${{ github.run_number }}\"/" ai_overlay.py
          grep "^APP_VERSION" ai_overlay.py

      - name: Build Windows EXE
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name AI-Overlay
          --collect-all sounddevice
          --collect-all uiautomation
          --collect-all comtypes
          ai_overlay.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Overlay-Windows
          path: dist/AI-Overlay.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          TAG="v1.0.${RUN_NUMBER}"
          TITLE="AI-Overlay ${TAG}"

          gh release create "$TAG" dist/AI-Overlay.exe \
            --title "$TITLE" \
            --generate-notes
